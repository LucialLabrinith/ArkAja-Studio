<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <defs>
    <linearGradient id="splitBgL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D231E" />
      <stop offset="60%" stop-color="#1E1714" />
      <stop offset="100%" stop-color="#120D0B" />
    </linearGradient>
    <linearGradient id="splitBgR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A2D25" />
      <stop offset="50%" stop-color="#251B16" />
      <stop offset="100%" stop-color="#150F0D" />
    </linearGradient>
    <linearGradient id="skinClient" x1="30%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#E5AF88" />
      <stop offset="50%" stop-color="#CD966E" />
      <stop offset="100%" stop-color="#A56E47" />
    </linearGradient>
    <radialGradient id="dewyCheek" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#FFE0C8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#CD966E" stop-opacity="0" />
    </radialGradient>
    <filter id="glowDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Split Screen Background Canvas -->
  <rect width="900" height="1200" fill="#140F0D" />

  <!-- Left Side: In-Clinic Treatment Stage -->
  <g clip-path="url(#leftHalfClip)">
    <clipPath id="leftHalfClip">
      <rect x="0" y="0" width="449" height="1200" />
    </clipPath>
    <rect x="0" y="0" width="450" height="1200" fill="url(#splitBgL)" />

    <!-- Ambient Spa Background with Candle & Greenery Bokeh -->
    <circle cx="260" cy="320" r="40" fill="#FFC870" fill-opacity="0.35" filter="blur(16px)" />
    <circle cx="180" cy="240" r="30" fill="#FFC870" fill-opacity="0.25" filter="blur(14px)" />

    <!-- Esthetician in Charcoal Spa Tunic -->
    <g transform="translate(40, 160)">
      <!-- Head / Hair -->
      <path d="M 60 50 C 60 10, 110 10, 110 50 C 110 80, 105 100, 85 110 C 65 100, 60 80, 60 50 Z" fill="#120E0C" />
      <rect x="76" y="105" width="18" height="25" fill="#B88059" />
      <!-- Dark Spa Uniform -->
      <path d="M 30 130 L 140 130 L 150 360 L 20 360 Z" fill="#242120" stroke="#3A3533" stroke-width="1" />
      <!-- Concentrated Therapist Gaze Profile -->
      <path d="M 85 85 Q 95 85 100 90" stroke="#120E0C" stroke-width="2" fill="none" />
      <!-- Arm holding Handpiece -->
      <path d="M 120 200 Q 180 260 220 310" stroke="#CD966E" stroke-width="24" stroke-linecap="round" fill="none" />
    </g>

    <!-- Client Lying Down in Headband on Treatment Bed -->
    <g transform="translate(110, 360)">
      <!-- White Spa Towel / Head Wrap -->
      <path d="M 50 180 C 40 120, 120 80, 190 100 C 240 115, 270 170, 260 230 L 70 230 Z" fill="#FAF8F5" stroke="#E2DDD5" stroke-width="1" />
      <ellipse cx="160" cy="115" rx="70" ry="18" fill="#F0EBE1" />

      <!-- Relaxed Serene Face in Repose -->
      <path d="M 70 160 C 90 120, 170 110, 210 145 C 240 170, 235 220, 210 250 C 160 270, 110 250, 70 200 Z" fill="url(#skinClient)" />
      <!-- Hydrated Glow on Forehead & High Temple -->
      <ellipse cx="180" cy="140" rx="35" ry="20" fill="url(#dewyCheek)" />

      <!-- Closed Relaxed Eyelashes -->
      <path d="M 130 165 Q 150 172 170 165" stroke="#2D1A10" stroke-width="2.5" fill="none" />
      <!-- Hydrafacial Suction Wand Contacting Skin with Luminous Blue Glow -->
      <g transform="translate(195, 175) rotate(-25)">
        <!-- Blue Hydration Fluid Ring -->
        <circle cx="0" cy="0" r="14" fill="#3B82F6" fill-opacity="0.4" filter="blur(3px)" />
        <circle cx="0" cy="0" r="6" fill="#60A5FA" />
        <!-- Handpiece Shaft -->
        <rect x="-6" y="-60" width="12" height="60" rx="2" fill="#FAF8F5" stroke="#94A3B8" stroke-width="1" />
        <rect x="-4" y="-35" width="8" height="15" fill="#38BDF8" />
        <line x1="0" y1="-60" x2="30" y2="-110" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round" />
      </g>
    </g>

    <!-- White Bed Sheet / Wrap -->
    <path d="M 40 680 L 450 680 L 450 1200 L 40 1200 Z" fill="#F5EFE6" stroke="#DDD7CC" stroke-width="1" />
  </g>

  <!-- Thin Center Split Line -->
  <line x1="450" y1="0" x2="450" y2="1200" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Right Side: Post-Treatment Radiant Client -->
  <g clip-path="url(#rightHalfClip)">
    <clipPath id="rightHalfClip">
      <rect x="451" y="0" width="449" height="1200" />
    </clipPath>
    <rect x="450" y="0" width="450" height="1200" fill="url(#splitBgR)" />

    <!-- Radiant Smiling Woman in White Waffle Robe -->
    <g transform="translate(480, 220)">
      <!-- Shiny Brunette Wavy Hair -->
      <path d="M 70 80 C 70 10, 200 10, 250 80 C 290 140, 290 280, 270 360 L 50 360 C 30 280, 30 140, 70 80 Z" fill="#1A120E" />

      <!-- Glowing Face Profile -->
      <path d="M 90 120 C 90 60, 180 50, 210 100 C 230 135, 230 220, 210 260 C 180 300, 120 290, 95 240 Z" fill="url(#skinClient)" />

      <!-- Dewy Light Reflections -->
      <ellipse cx="140" cy="120" rx="35" ry="18" fill="url(#dewyCheek)" />
      <ellipse cx="185" cy="180" rx="25" ry="35" fill="url(#dewyCheek)" />
      <ellipse cx="150" cy="265" rx="14" ry="10" fill="url(#dewyCheek)" />

      <!-- Joyful Eyes & Full Smile -->
      <ellipse cx="130" cy="148" rx="8" ry="5" fill="#1C110A" />
      <ellipse cx="185" cy="150" rx="8" ry="5" fill="#1C110A" />
      <!-- Defined natural brows -->
      <path d="M 115 136 Q 135 130 150 138" stroke="#1A120E" stroke-width="3" fill="none" stroke-linecap="round" />
      <path d="M 172 138 Q 190 132 205 140" stroke="#1A120E" stroke-width="3" fill="none" stroke-linecap="round" />
      <!-- Bright smiling teeth & rose lips -->
      <path d="M 135 220 Q 160 248 185 220 Z" fill="#FAF8F5" stroke="#B85959" stroke-width="2" />
      <path d="M 130 216 Q 160 208 190 216" stroke="#9C4444" stroke-width="2" fill="none" />

      <!-- White Waffle Bathrobe -->
      <path d="M 20 310 C 80 270, 220 270, 280 310 L 330 680 L -30 680 Z" fill="#FAF8F5" stroke="#E2DDD5" stroke-width="1.5" />
      <!-- Robe Collar Overlap -->
      <path d="M 70 310 L 155 460 L 130 680" stroke="#DDD7CC" stroke-width="3" fill="none" />
      <path d="M 230 310 L 155 460" stroke="#DDD7CC" stroke-width="3" fill="none" />

      <!-- Holding a Glass of Infused Water -->
      <g transform="translate(130, 480)">
        <rect x="0" y="0" width="55" height="75" rx="6" fill="#FFFFFF" fill-opacity="0.3" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="1.5" />
        <ellipse cx="27" cy="10" rx="22" ry="6" fill="#FFFFFF" fill-opacity="0.4" />
        <!-- Water Level & Lemon/Mint Slice -->
        <rect x="3" y="15" width="49" height="55" rx="4" fill="#67E8F9" fill-opacity="0.25" />
        <circle cx="28" cy="40" r="12" fill="#FDE047" fill-opacity="0.6" />
      </g>
    </g>
  </g>

  <!-- Editorial Centerpiece Typography Overlay (Spanning Across Split Screen) -->
  <g transform="translate(450, 520)" text-anchor="middle" filter="url(#glowDrop)">
    <text y="0" font-family="'Cormorant Garamond', Georgia, serif" font-size="44" font-weight="700" letter-spacing="0.04em" fill="#FFFFFF">
      POV: YOU FINALLY BOOKED
    </text>
    <text y="50" font-family="'Cormorant Garamond', Georgia, serif" font-size="44" font-weight="700" letter-spacing="0.04em" fill="#FFFFFF">
      THE FACIAL YOU’VE BEEN
    </text>
    <text y="100" font-family="'Cormorant Garamond', Georgia, serif" font-size="44" font-weight="700" letter-spacing="0.04em" fill="#FFFFFF">
      POSTPONING.
    </text>

    <!-- Project Credit Subtitle with Sparkle Motif -->
    <g transform="translate(0, 155)">
      <text font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" letter-spacing="0.26em" fill="#FAF8F5" fill-opacity="0.9">
        LUMIÈRE BEAUTY | CONCEPT PROJECT BY ARKAJA STUDIO
      </text>
    </g>
  </g>

  <!-- Sparkle Accent Icon in Bottom Corner -->
  <g transform="translate(680, 840)" fill="#FAF8F5" fill-opacity="0.75">
    <path d="M 0 -14 Q 0 0 14 0 Q 0 0 0 14 Q 0 0 -14 0 Q 0 0 0 -14 Z" />
  </g>
</svg>
