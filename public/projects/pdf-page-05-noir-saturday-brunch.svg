<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <defs>
    <linearGradient id="cafeBlurBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D231E" />
      <stop offset="35%" stop-color="#1F1713" />
      <stop offset="100%" stop-color="#140E0B" />
    </linearGradient>
    <linearGradient id="travertineTable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDD6C9" />
      <stop offset="50%" stop-color="#C5BEB0" />
      <stop offset="100%" stop-color="#ADA597" />
    </linearGradient>
    <linearGradient id="croissantP5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2BA74" />
      <stop offset="45%" stop-color="#C97825" />
      <stop offset="85%" stop-color="#8C440E" />
      <stop offset="100%" stop-color="#4E2304" />
    </linearGradient>
    <linearGradient id="latteArtP5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C78747" />
      <stop offset="40%" stop-color="#A56329" />
      <stop offset="100%" stop-color="#6E3811" />
    </linearGradient>
    <filter id="brunchShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="900" height="1200" fill="#140E0B" />

  <!-- Cafe Background Scene (Chalkboard sign & Wooden Chairs in soft blur) -->
  <rect width="900" height="420" fill="url(#cafeBlurBg)" />

  <!-- Cafe Chalkboard Menu in Background ("NOIR & BEAN") -->
  <g transform="translate(680, 180) rotate(5)">
    <rect width="130" height="90" rx="4" fill="#1C1815" stroke="#6A5A4E" stroke-width="6" />
    <text x="65" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="0.15em" fill="#FAF8F5" text-anchor="middle">
      NOIR &amp; BEAN
    </text>
    <line x1="25" y1="55" x2="105" y2="55" stroke="#FAF8F5" stroke-opacity="0.4" stroke-width="1" />
  </g>

  <!-- Wooden Bistro Chairs in Background -->
  <g stroke="#3A2D23" stroke-width="8" stroke-linecap="round" fill="none">
    <!-- Left Chair -->
    <line x1="180" y1="280" x2="150" y2="600" />
    <line x1="220" y1="280" x2="190" y2="600" />
    <line x1="140" y1="360" x2="260" y2="360" />
    <!-- Right Chair -->
    <line x1="720" y1="280" x2="740" y2="600" />
    <line x1="760" y1="280" x2="780" y2="600" />
  </g>

  <!-- Top Left Stamp / Badge ("NOIR & BEAN") -->
  <g transform="translate(160, 150) rotate(-12)">
    <rect x="-10" y="-18" width="165" height="38" rx="2" fill="none" stroke="#FAF8F5" stroke-width="2" stroke-dasharray="6,3" />
    <text x="72" y="6" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" letter-spacing="0.22em" fill="#FAF8F5" text-anchor="middle">
      NOIR &amp; BEAN
    </text>
  </g>

  <!-- Top Promotional Headlines -->
  <g transform="translate(450, 220)" text-anchor="middle">
    <text y="0" font-family="'Cormorant Garamond', Georgia, serif" font-size="56" font-weight="700" letter-spacing="0.04em" fill="#FAF8F5">
      SATURDAY
    </text>
    <text y="54" font-family="'Cormorant Garamond', Georgia, serif" font-size="56" font-weight="700" letter-spacing="0.04em" fill="#FAF8F5">
      BRUNCH CLUB
    </text>

    <!-- Pricing Offer -->
    <text y="102" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="600" letter-spacing="0.02em" fill="#FAF8F5">
      Coffee + Croissant + Eggs ₹499
    </text>
    <text y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="400" letter-spacing="0.05em" fill="#D9A86C">
      Saturdays • 9AM–1PM
    </text>
  </g>

  <!-- Rustic Porous Travertine Stone Table Top -->
  <polygon points="90,420 810,420 840,1050 60,1050" fill="url(#travertineTable)" stroke="#8A8275" stroke-width="2" filter="url(#brunchShadow)" />
  <!-- Pores and Weathered Stone Textures -->
  <ellipse cx="280" cy="540" rx="18" ry="6" fill="#A0988A" fill-opacity="0.5" />
  <ellipse cx="620" cy="580" rx="24" ry="8" fill="#A0988A" fill-opacity="0.4" />
  <ellipse cx="400" cy="720" rx="30" ry="9" fill="#A0988A" fill-opacity="0.4" />
  <ellipse cx="220" cy="850" rx="20" ry="7" fill="#A0988A" fill-opacity="0.5" />

  <!-- 1. Fresh Golden Croissant on Ceramic Plate (Top Left Table) -->
  <g transform="translate(230, 480)">
    <!-- Plate Shadow & Plate -->
    <ellipse cx="80" cy="70" rx="90" ry="55" fill="#8C8477" fill-opacity="0.4" />
    <ellipse cx="80" cy="65" rx="88" ry="50" fill="#FAF8F5" stroke="#DDD7CC" stroke-width="1.5" />
    <ellipse cx="80" cy="65" rx="72" ry="40" fill="#F4EFE6" />

    <!-- Crescent Croissant with Flaky Lamination Ridges -->
    <path d="M 20 60 C 25 30, 75 20, 115 35 C 135 45, 140 70, 110 80 C 70 85, 20 80, 20 60 Z" fill="url(#croissantP5)" />
    <path d="M 45 42 Q 65 30 90 48 Q 110 32 125 55" fill="none" stroke="#FDE0A6" stroke-width="3" stroke-linecap="round" />
    <path d="M 55 60 Q 80 46 105 68" fill="none" stroke="#542505" stroke-width="2" />
    <!-- Fork resting on plate edge -->
    <line x1="45" y1="95" x2="135" y2="35" stroke="#A0AEC0" stroke-width="2.5" />
  </g>

  <!-- 2. Cappuccino with Rosette Latte Art in Cup & Saucer (Top Right Table) -->
  <g transform="translate(580, 440)">
    <!-- Saucer -->
    <ellipse cx="70" cy="80" rx="75" ry="45" fill="#8C8477" fill-opacity="0.35" />
    <ellipse cx="70" cy="75" rx="72" ry="40" fill="#EAE5DC" stroke="#CDC5B5" stroke-width="1.5" />
    <!-- Ceramic Cup -->
    <ellipse cx="70" cy="62" rx="52" ry="30" fill="#4A3F35" stroke="#EAE5DC" stroke-width="4" />
    <!-- Handle -->
    <path d="M 120 58 Q 140 62 135 75 Q 125 80 115 72" fill="none" stroke="#EAE5DC" stroke-width="5" />

    <!-- Velvet Microfoam & Rosette Art -->
    <ellipse cx="70" cy="62" rx="46" ry="24" fill="url(#latteArtP5)" />
    <!-- White Silky Heart / Leaf Leaves -->
    <path d="M 70 48 C 76 54, 82 62, 70 74 C 58 62, 64 54, 70 48 Z" fill="#FFFFFF" fill-opacity="0.95" />
    <path d="M 70 52 C 78 58, 86 64, 70 72 C 54 64, 62 58, 70 52 Z" fill="#FFFFFF" fill-opacity="0.9" />
    <line x1="70" y1="46" x2="70" y2="76" stroke="#5E2C09" stroke-width="1.5" />
    <!-- Small Brass Spoon on Saucer -->
    <line x1="15" y1="92" x2="80" y2="82" stroke="#D4AF37" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Glass of Water & Flower Vase -->
  <g transform="translate(520, 410)">
    <!-- Glass with Water -->
    <rect x="0" y="20" width="30" height="45" rx="4" fill="#FFFFFF" fill-opacity="0.3" stroke="#CBD5E1" stroke-width="1" />
    <rect x="2" y="32" width="26" height="30" fill="#67E8F9" fill-opacity="0.3" />
    <!-- Dried Flower Bouquet in Bud Vase -->
    <g transform="translate(50, -40)">
      <ellipse cx="15" cy="80" rx="14" ry="20" fill="#FFFFFF" fill-opacity="0.4" stroke="#CBD5E1" stroke-width="1" />
      <line x1="15" y1="80" x2="5" y2="10" stroke="#786A5A" stroke-width="1.5" />
      <line x1="15" y1="80" x2="25" y2="5" stroke="#786A5A" stroke-width="1.5" />
      <circle cx="5" cy="10" r="6" fill="#FDE047" fill-opacity="0.7" />
      <circle cx="25" cy="5" r="5" fill="#E2E8F0" />
      <circle cx="15" cy="0" r="4" fill="#FDE047" fill-opacity="0.7" />
    </g>
  </g>

  <!-- 3. Main Centerpiece: Artisan Avocado Poached Eggs Toast Plate -->
  <g transform="translate(420, 620)">
    <!-- Plate Shadow & Rustic Ceramic Plate -->
    <ellipse cx="100" cy="140" rx="180" ry="110" fill="#80776A" fill-opacity="0.4" />
    <ellipse cx="100" cy="130" rx="175" ry="105" fill="#E5DFD5" stroke="#CDC5B5" stroke-width="2" />
    <ellipse cx="100" cy="130" rx="145" ry="85" fill="#DCD5C9" />

    <!-- Cutlery & Linen Strip Resting alongside Plate -->
    <polygon points="-80,180 -10,130 10,210 -60,260" fill="#F4EFE6" stroke="#DDD7CC" stroke-width="1" />
    <!-- Fork -->
    <line x1="-30" y1="130" x2="20" y2="240" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
    <!-- Knife -->
    <line x1="180" y1="110" x2="240" y2="230" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />

    <!-- Sourdough Toast Slice -->
    <path d="M 10 130 C 15 85, 95 80, 160 90 C 200 95, 205 140, 175 160 C 130 175, 20 165, 10 130 Z" fill="#9C6B3E" stroke="#5E3815" stroke-width="2" />
    <path d="M 22 130 C 28 95, 95 90, 150 98 C 185 105, 185 140, 160 152 C 120 162, 30 155, 22 130 Z" fill="#E5CA9E" />

    <!-- Smashed Avocado Layer -->
    <path d="M 30 125 C 40 100, 95 98, 145 105 C 175 110, 175 145, 145 152 C 105 158, 40 150, 30 125 Z" fill="#65A30D" />
    <!-- Green Edamame / Avocado Chunks -->
    <ellipse cx="60" cy="118" rx="10" ry="6" fill="#84CC16" />
    <ellipse cx="110" cy="110" rx="12" ry="7" fill="#84CC16" />
    <ellipse cx="140" cy="135" rx="9" ry="5" fill="#84CC16" />

    <!-- Poached Egg 1 (Left) -->
    <ellipse cx="78" cy="120" rx="28" ry="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="80" cy="116" r="14" fill="#FEF08A" fill-opacity="0.8" />
    <!-- Poached Egg 2 (Right) -->
    <ellipse cx="125" cy="125" rx="30" ry="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="127" cy="122" r="15" fill="#FEF08A" fill-opacity="0.8" />

    <!-- Fresh Cherry Tomatoes Halves (Vibrant Red) -->
    <ellipse cx="48" cy="135" rx="9" ry="7" fill="#DC2626" />
    <ellipse cx="50" cy="133" rx="4" ry="3" fill="#EF4444" />
    <ellipse cx="105" cy="148" rx="8" ry="6" fill="#DC2626" />
    <ellipse cx="155" cy="122" rx="9" ry="7" fill="#DC2626" />

    <!-- Microgreens & Chili Pepper Flakes Sprinkled on Top -->
    <circle cx="75" cy="115" r="1.5" fill="#991B1B" />
    <circle cx="85" cy="122" r="1.2" fill="#991B1B" />
    <circle cx="120" cy="118" r="1.8" fill="#991B1B" />
    <circle cx="135" cy="125" r="1.5" fill="#991B1B" />
    <!-- Green Chive Snippets -->
    <line x1="72" y1="110" x2="82" y2="108" stroke="#15803D" stroke-width="2" />
    <line x1="118" y1="115" x2="128" y2="112" stroke="#15803D" stroke-width="2" />
    <line x1="95" y1="130" x2="105" y2="135" stroke="#15803D" stroke-width="2" />
  </g>

  <!-- Bottom Stamp & Call to Action ("Reserve your table") -->
  <g transform="translate(180, 750) rotate(-8)">
    <rect x="-8" y="-14" width="125" height="30" rx="2" fill="none" stroke="#3A2D23" stroke-width="1.5" stroke-dasharray="4,2" />
    <text x="54" y="6" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="0.18em" fill="#3A2D23" text-anchor="middle">
      NOIR &amp; BEAN
    </text>
  </g>

  <g transform="translate(450, 1100)" text-anchor="middle">
    <text y="0" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="600" letter-spacing="0.05em" fill="#FAF8F5">
      Reserve your table
    </text>
  </g>
</svg>
